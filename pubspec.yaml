name: s_dialer
description: "SamDialer - Faithful Samsung One UI Phone App Clone for Flutter & Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # System & Device Permissions
  permission_handler: ^11.4.0

  # Device Contacts
  flutter_contacts: ^1.1.9+2

  # Storage & Utilities
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  path: ^1.9.1

  # Google Sync (Milestone 6)
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # UI & Icons
  cupertino_icons: ^1.0.8
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  shared_preferences_android: 2.4.22

flutter:
  uses-material-design: true
  assets:
    - assets/images/
